upstream uicp_backend {
    least_conn;
    server uicp-1:5000 max_fails=3 fail_timeout=30s;
    server uicp-2:5000 max_fails=3 fail_timeout=30s;
    server uicp-3:5000 max_fails=3 fail_timeout=30s;
}

server {
    listen 80;

    location /health {
        proxy_pass http://uicp_backend;
        proxy_connect_timeout 2s;
        proxy_read_timeout 2s;
    }

    location /enforce {
        proxy_pass http://uicp_backend;
        proxy_read_timeout 30s;
    }
}
