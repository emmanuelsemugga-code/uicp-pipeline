version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: uicp_audit
      POSTGRES_USER: uicp
      POSTGRES_PASSWORD: uicp_test_password
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uicp -d uicp_audit"]
      interval: 10s
      timeout: 5s
      retries: 5

  uicp-1:
    build: .
    environment:
      INSTANCE_ID: uicp-1
      DATABASE_URL: postgresql://uicp:uicp_test_password@postgres:5432/uicp_audit
      API_KEY: sk-test-multi-instance
      CONSTRAINT_SET_PATH: /etc/constraints.json
    volumes:
      - ./constraints.json:/etc/constraints.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 5s
      timeout: 3s
      retries: 2

  uicp-2:
    build: .
    environment:
      INSTANCE_ID: uicp-2
      DATABASE_URL: postgresql://uicp:uicp_test_password@postgres:5432/uicp_audit
      API_KEY: sk-test-multi-instance
      CONSTRAINT_SET_PATH: /etc/constraints.json
    volumes:
      - ./constraints.json:/etc/constraints.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 5s
      timeout: 3s
      retries: 2

  uicp-3:
    build: .
    environment:
      INSTANCE_ID: uicp-3
      DATABASE_URL: postgresql://uicp:uicp_test_password@postgres:5432/uicp_audit
      API_KEY: sk-test-multi-instance
      CONSTRAINT_SET_PATH: /etc/constraints.json
    volumes:
      - ./constraints.json:/etc/constraints.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 5s
      timeout: 3s
      retries: 2

  nginx:
    image: nginx:alpine
    ports:
      - "5000:80"
    volumes:
      - ./config/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - uicp-1
      - uicp-2
      - uicp-3

volumes:
  pgdata:
